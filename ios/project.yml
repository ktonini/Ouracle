name: Ouracle
options:
  bundleIdPrefix: com.ktonini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: K3M2778TQN

targets:
  Ouracle:
    type: application
    platform: iOS
    sources:
      - Ouracle/Sources
      - Ouracle/Resources
    dependencies:
      - target: OuracleWidget
    entitlements:
      path: Ouracle/Ouracle.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ktonini.ouracle
        com.apple.developer.healthkit: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Ouracle
        TARGETED_DEVICE_FAMILY: "1"
        # Standard HTTPS only — answers the export-compliance question so
        # TestFlight builds are available to testers immediately.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Ouracle does not read Health data."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Ouracle writes your ring's sleep stages, HRV, and resting heart rate into Apple Health."
        PRODUCT_BUNDLE_IDENTIFIER: com.ktonini.ouracle
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set your Apple ID team in Xcode (Signing & Capabilities) to deploy
        # to a device; simulator builds need no signing.
        CODE_SIGN_STYLE: Automatic

  OuracleWidget:
    type: app-extension
    platform: iOS
    sources:
      - OuracleWidget
      - Ouracle/Sources/Models/SyncModels.swift
      - Ouracle/Sources/API/OuracleClient.swift
      - Ouracle/Sources/Support/Keychain.swift
      - Ouracle/Sources/Support/SharedStore.swift
    entitlements:
      path: OuracleWidget/OuracleWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ktonini.ouracle
    info:
      path: OuracleWidget/Info.plist
      properties:
        CFBundleDisplayName: Ouracle Scores
        # Must match the containing app (ITMS-90473); reference the build
        # settings instead of xcodegen's literal 1 / 1.0 defaults.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ktonini.ouracle.widget
        CODE_SIGN_STYLE: Automatic

  OuracleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OuracleTests
    dependencies:
      - target: Ouracle
