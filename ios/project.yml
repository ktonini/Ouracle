name: Ouracle
options:
  bundleIdPrefix: com.ktonini
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Ouracle:
    type: application
    platform: iOS
    sources:
      - Ouracle/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Ouracle
        PRODUCT_BUNDLE_IDENTIFIER: com.ktonini.ouracle
        # Set your Apple ID team in Xcode (Signing & Capabilities) to deploy
        # to a device; simulator builds need no signing.
        CODE_SIGN_STYLE: Automatic

  OuracleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OuracleTests
    dependencies:
      - target: Ouracle
